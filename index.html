<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>はなひらく 議事録</title>
<style>
  :root { --bg:#fdf6f9; --card:#fff; --ink:#1a1a1a; --ink-sub:#555; --ink-mute:#888; --line:#e5e0d4; --accent:#be185d; --accent-soft:#fce7f3; }
  * { box-sizing:border-box; margin:0; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif; background:var(--bg); color:var(--ink); min-height:100vh; display:flex; align-items:center; justify-content:center; }
  .container { max-width:560px; width:100%; padding:40px 20px; }
  h1 { font-size:22px; margin-bottom:6px; }
  .sub { font-size:13px; color:var(--ink-mute); margin-bottom:32px; }
  .cards { display:flex; flex-direction:column; gap:12px; }
  a.card { display:flex; align-items:center; gap:16px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px 24px; text-decoration:none; color:var(--ink); transition:box-shadow .15s,border-color .15s; }
  a.card:hover { border-color:var(--accent); box-shadow:0 2px 12px rgba(190,24,93,.12); }
  .icon { width:44px; height:44px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0; background:#fce7f3; }
  .card-body h2 { font-size:16px; margin-bottom:2px; }
  .card-body p { font-size:13px; color:var(--ink-sub); }
  .badge { display:inline-block; font-size:11px; font-weight:600; padding:2px 8px; border-radius:4px; margin-left:8px; background:#fce7f3; color:#be185d; }
</style>
</head>
<body>
<div class="container">
  <h1>はなひらく 議事録</h1>
  <p class="sub">はなひらく系の打ち合わせ議事録一覧</p>
  <div class="cards">
    <a class="card" href="index-hanahiraku.html">
      <div class="icon">&#127800;</div>
      <div class="card-body">
        <h2>はなひらくMT<span class="badge badge-h">0件</span></h2>
        <p>はなひらく（全体／B型／soil／寿／塩尻）の打ち合わせ議事録</p>
      </div>
    </a>
  </div>
</div>
</body>
</html>
